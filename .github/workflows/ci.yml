name: CI
on:
  - push
  - pull_request
  - workflow_dispatch

permissions:
  contents: read

jobs:
  # Build, test, and publish to PyPI via the shared dv-flow workflow.
  #
  # That workflow publishes only on a v* TAG and only when the
  # release-authority switch (https://dvkit.org/.well-known/release-authority.json)
  # names GitHub. A push to a branch never releases anything: branch builds are
  # stamped with a PEP 440 local version segment, which PyPI rejects outright.
  # See dv-flow/dv-flow-release.
  #
  # build_docs stays false. The docs build needs sphinx-dv-flow, which is not
  # on PyPI and is resolved through ivpm's default-dev set -- the shared
  # workflow's `cd docs && make html` would run before that is in place. The
  # docs job below is this repo's own build, and it is a CHECK only: docs are
  # published to dvkit.org from .forgejo/workflows/docs.yml and nowhere else.
  ci:
    uses: dv-flow/dv-flow-release/.github/workflows/dv-flow-pybuild.yml@main
    with:
        version_dir: "src/dv_flow/libhdllint"
        tests_dir: "tests"
        build_docs: false
        pythonpath: "$(pwd)/src"
    secrets:
        PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  # Build the Sphinx docs on every event so doc-build breakage is caught on the
  # commit that introduced it.
  #
  # THERE IS NO PAGES DEPLOY HERE, AND THERE MUST NOT BE. dvkit.org owns all
  # documentation: these docs publish to dvkit.org/dv-flow/dv-flow-libhdllint/
  # from .forgejo/workflows/docs.yml. dvkit.org is a single Cloudflare Pages
  # project and a deploy replaces the WHOLE site, so there is exactly one
  # publisher for it. A second publisher of the same content on a different
  # schedule is the problem regardless of how rarely it fires.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the docs environment
        # ivpm rather than pip: the task reference is generated by
        # sphinx-dv-flow, which is not published on PyPI. `pip install .[docs]`
        # would get everything except the one piece that makes these docs what
        # they are, and the build would then succeed with the reference pages
        # replaced by errors.
        shell: bash
        run: |
          python3 -m venv py
          ./py/bin/pip install --upgrade --pre ivpm
          ./py/bin/ivpm update -a -d default-dev

      - name: Install this distribution into the docs environment
        # THE BACKEND PAGES DO NOT RENDER WITHOUT THIS. Each backend flow file
        # carries `imports: - name: hdllint`, and dv-flow resolves that through
        # the `dv_flow.mgr` entry point -- which exists only once the
        # distribution is installed. ivpm resolves DEPENDENCIES, not the
        # project itself, so without this step the six backend packages load
        # with `Imported package 'hdllint' not found` and their pages come out
        # empty. It passes on a developer's machine because ivpm has usually
        # installed this project into the surrounding venv already, which is
        # exactly why it has to be checked here rather than trusted.
        #
        # --no-deps: the dependency tree is ivpm's, resolved from source
        # checkouts. Letting pip re-resolve it would quietly replace them with
        # PyPI releases.
        shell: bash
        run: |
          ./packages/python/bin/python -m pip install -q --no-deps .
          ./packages/python/bin/python -c "
          import sys
          from dv_flow.mgr.ext_rgy import ExtRgy
          rgy = ExtRgy.inst()
          missing = [p for p in ['hdllint', 'hdllint.vlt', 'hdllint.spy', 'hdllint.vcs',
                                 'hdllint.qst', 'hdllint.jg', 'hdllint.z0i']
                     if not rgy.hasPackage(p, search_path=False)]
          if missing:
              sys.exit('::error::the dv_flow.mgr entry point did not register: %s' % ', '.join(missing))
          print('OK: all seven flow packages are registered')"

      - name: Build docs
        shell: bash
        run: |
          set -o pipefail
          make -C docs html 2>&1 | tee /tmp/sphinx.log

      - name: Sanity-check the build
        # Sphinx exits 0 on a build that produced almost nothing, and
        # sphinx-dv-flow deliberately degrades an unresolvable package to a
        # warning rather than failing the build -- so the exit status alone
        # does not tell you the reference pages have anything on them.
        shell: bash
        run: |
          html=docs/_build/html
          test -s "$html/index.html" \
            || { echo "::error::no index.html in the build output"; exit 1; }
          n=$(find "$html" -name '*.html' | wc -l)
          echo "generated pages: $n"
          # 23 is what THIS doc set contributes. Do not raise it to match a
          # local build: sphinx-dv-flow's viewcode adds one `_flow_source/`
          # listing per .dv file (7 more here), so a developer with a newer
          # checkout of it counts 30 and CI counts 23. A floor that tracks an
          # upstream feature is a floor that goes red on an unrelated commit.
          [ "$n" -ge 22 ] || { echo "::error::only $n pages built; this doc set produces 23"; exit 1; }
          for idx in dvf-tasks dvf-types; do
            test -s "$html/${idx}.html" \
              || { echo "::error::${idx}.html missing; the dvf domain registered no objects"; exit 1; }
          done
          # A flow package that fails to load is a WARNING by design -- a
          # resolution failure must not fail someone else's docs build. Here it
          # is the thing being tested, so it is promoted back to an error.
          # Scoped to dvflow.load rather than using `-W`, so an unrelated
          # deprecation in a new Sphinx cannot block a docs publish.
          if grep -q 'dvflow.load' /tmp/sphinx.log; then
            echo "::error::sphinx-dv-flow could not load a flow package:"
            grep 'dvflow.load' /tmp/sphinx.log
            exit 1
          fi
          echo "OK: $n pages, dvf indices present, every flow package loaded"
