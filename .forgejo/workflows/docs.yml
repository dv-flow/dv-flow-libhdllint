# Docs build for dv-flow/dv-flow-libhdllint on Forgejo Actions.
#
# THIS IS THE ONLY THING THAT PUBLISHES THESE DOCS. .github/workflows/ci.yml
# builds them too, as a CI check, and deploys nothing. dvkit.org owns all
# documentation: a repo's docs land at dvkit.org/<org>/<repo>/. dvkit.org is a
# single Cloudflare Pages project and a deploy replaces the WHOLE site, so
# there is exactly one publisher for it -- a repo deploying its own _site would
# wipe the portal and every other project's docs.
#
# What happens after this job, all of it host-side:
#
#   docs-fetch dv-flow/dv-flow-libhdllint main   # artifact -> staging/
#   docs-promote / docs-deploy                   # -> dvkit.org/dv-flow/dv-flow-libhdllint/
#
# The built HTML leaves as an ARTIFACT and nothing else. This job holds no
# Cloudflare token: a workflow file is public and editable by anyone who can
# push, and the deploy credential is account-scoped.
#
# Constraints this file is shaped by, all measured on this instance:
#
#  1. No third-party actions. A bare `uses:` resolves against code.forgejo.org
#     (Forgejo's DEFAULT_ACTIONS_URL), not github.com, so actions/setup-python
#     does not exist here. `actions/checkout` and `forgejo/upload-artifact` do.
#  2. `python` unqualified DOES NOT EXIST in the runner image. Use python3.
#  3. ivpm IS required here, unlike most docs jobs in this org. The task
#     reference is generated by sphinx-dv-flow, which is not on PyPI -- there
#     is no pip-only route to a complete build of these docs.
#  4. Dependencies resolve through git.dvkit.org rather than github.com. This
#     is Forgejo's own instance publishing its own docs; routing the clones
#     back out to GitHub would make a docs build depend on the mirror being
#     current.
#  5. NO release-authority gate. That switch decides who publishes PACKAGES to
#     PyPI. Docs are not a release: they publish from Forgejo to dvkit.org
#     unconditionally, whichever side holds release authority. Adding the gate
#     here would silently stop docs whenever the switch said "github".
#  6. The artifact name is the `docs-<org>-<repo>` convention docs-fetch matches
#     on, and `path: .../**` makes the build directory the ZIP ROOT --
#     docs-fetch refuses an artifact with no index.html at the top level.

name: Docs

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Check for internal identifiers in tracked files
        # This repo is published to git.dvkit.org and mirrored to GitHub, so
        # anything committed here is public. Internal host names, tailnet
        # addresses and CGNAT-range IPs must not appear in tracked files.
        run: |
          pattern='perch-char\.ts\.net|\.ts\.net|a9550|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
          if git grep -nIE "$pattern" -- . ':!.forgejo/workflows/' ; then
            echo "::error::internal identifier found in a tracked file (see matches above)"
            exit 1
          fi
          echo "OK: no internal identifiers in tracked files"

      - name: Report the environment
        # `runs-on` decides the Python version, and a too-old one surfaces as a
        # resolution failure deep inside ivpm rather than as a version problem.
        run: |
          echo "python: $(python3 -V 2>&1)  at $(command -v python3)"
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 11):
              sys.exit("::error::python %d.%d is too old for the docs toolchain. "
                       "Check `runs-on`." % sys.version_info[:2])
          PY

      - name: Install ivpm
        run: |
          python3 -m venv py
          ./py/bin/python3 -m pip install -q --upgrade pip
          ./py/bin/python3 -m pip install -q ivpm

      - name: Configure ivpm dependency resolution
        # ivpm.yaml names github.com URLs because that is what a user cloning
        # this repo should get. Inside Forgejo they resolve to the local
        # mirror, so a docs build does not depend on github.com being
        # reachable or on the mirror being current.
        run: |
          mkdir -p ~/.config/ivpm
          cat > ~/.config/ivpm/config.yaml <<'EOF'
          git-url-map:
            - from: "https://github.com/dv-flow/"
              to:   "https://git.dvkit.org/dv-flow/"
            - from: "https://github.com/fvutils/"
              to:   "https://git.dvkit.org/fvutils/"
          git-auth:
            - host: "git.dvkit.org"
              order: ["https"]
          EOF

      - name: Assemble the docs environment
        # `default-dev`, not the `docs` set on its own. `docs` carries sphinx,
        # furo, myst-parser, sphinxcontrib-mermaid and a sphinx-dv-flow
        # checkout -- but sphinx-dv-flow loads flow files through dv_flow.mgr,
        # and autodoc imports modules that import it too. dv-flow-mgr is in
        # `default-dev`, which `uses: [docs]`, so this set is the whole
        # toolchain and the `docs` set alone would build error boxes where the
        # reference pages should be.
        #
        # The explicit checks below are here because ivpm exits 0 on a
        # partially resolved set.
        run: |
          ./py/bin/python3 -m ivpm update -j 1 -a -d default-dev
          if [ ! -x packages/python/bin/sphinx-build ]; then
            echo "::error::ivpm update produced no packages/python/bin/sphinx-build."
            echo "Resolved packages:"
            ls -1 packages/ || true
            exit 1
          fi
          test -d packages/sphinx-dv-flow/src/sphinx_dv_flow \
            || { echo "::error::packages/sphinx-dv-flow/src/sphinx_dv_flow missing; docs/conf.py cannot load the extension"; exit 1; }
          ./packages/python/bin/python - <<'PY'
          import sys
          import sphinx
          print("sphinx", sphinx.__version__)
          missing = []
          for mod in ("myst_parser", "furo", "sphinxcontrib.mermaid", "dv_flow.mgr"):
              try:
                  __import__(mod)
              except ImportError as e:
                  missing.append("%s (%s)" % (mod, e))
          if missing:
              sys.exit("::error::ivpm update was green but the venv is "
                       "incomplete: " + "; ".join(missing))
          PY

      - name: Install this distribution into the docs environment
        # THE BACKEND PAGES DO NOT RENDER WITHOUT THIS. Each backend flow file
        # carries `imports: - name: hdllint`, and dv-flow resolves that through
        # the `dv_flow.mgr` entry point -- which exists only once the
        # distribution is installed. ivpm resolves DEPENDENCIES, not the
        # project itself, so without this step the six backend packages load
        # with `Imported package 'hdllint' not found` and their pages come out
        # empty. It passes on a developer's machine because ivpm has usually
        # installed this project into the surrounding venv already, which is
        # exactly why it has to be checked here rather than trusted.
        #
        # --no-deps: the dependency tree is ivpm's, resolved from source
        # checkouts. Letting pip re-resolve it would quietly replace them with
        # PyPI releases.
        run: |
          ./packages/python/bin/python -m pip install -q --no-deps .
          ./packages/python/bin/python -c "
          import sys
          from dv_flow.mgr.ext_rgy import ExtRgy
          rgy = ExtRgy.inst()
          missing = [p for p in ['hdllint', 'hdllint.vlt', 'hdllint.spy', 'hdllint.vcs',
                                 'hdllint.qst', 'hdllint.jg', 'hdllint.z0i']
                     if not rgy.hasPackage(p, search_path=False)]
          if missing:
              sys.exit('::error::the dv_flow.mgr entry point did not register: %s' % ', '.join(missing))
          print('OK: all seven flow packages are registered')"

      - name: Build HTML docs
        # autodoc imports the package, so src/ has to be importable; docs/conf.py
        # puts it on sys.path so this works whether or not the distribution is
        # installed into the environment running Sphinx.
        run: |
          set -o pipefail
          make -C docs html 2>&1 | tee /tmp/sphinx.log
          touch docs/_build/html/.nojekyll

      - name: Sanity-check the build
        # Auto-promote means there is no review gate in front of the default
        # branch: these checks are what stands in its place. Sphinx exits 0 on a
        # build that produced almost nothing, and sphinx-dv-flow deliberately
        # degrades an unresolvable package to a warning rather than failing the
        # build -- so the exit status alone does not tell you the reference
        # pages have anything on them.
        run: |
          html=docs/_build/html
          test -s "$html/index.html" \
            || { echo "::error::no index.html in the build output"; exit 1; }
          n=$(find "$html" -name '*.html' | wc -l)
          echo "generated pages: $n"
          # 23 is what THIS doc set contributes. Do not raise it to match a
          # local build: sphinx-dv-flow's viewcode adds one `_flow_source/`
          # listing per .dv file (7 more here), so a developer with a newer
          # checkout of it counts 30 and CI counts 23. A floor that tracks an
          # upstream feature is a floor that goes red on an unrelated commit.
          [ "$n" -ge 22 ] || { echo "::error::only $n pages built; this doc set produces 23. Refusing to call this a doc set."; exit 1; }
          for page in reference/hdllint.html reference/backends.html reference/api.html; do
            test -s "$html/$page" \
              || { echo "::error::$page missing or empty"; exit 1; }
          done
          for idx in dvf-tasks dvf-types; do
            test -s "$html/${idx}.html" \
              || { echo "::error::${idx}.html missing; the dvf domain registered no objects"; exit 1; }
          done
          # The generated reference is the reason this build needs ivpm at all.
          # A page that rendered as an error box is still a page, so count the
          # tasks the domain actually registered.
          grep -q 'hdllint.vlt' "$html/reference/backends.html" \
            || { echo "::error::reference/backends.html does not mention hdllint.vlt; the backend packages did not load"; exit 1; }
          # A flow package that fails to load is a WARNING by design -- a
          # resolution failure must not fail someone else's docs build. Here it
          # is the thing being tested, so it is promoted back to an error.
          # Scoped to dvflow.load rather than using `-W`, so an unrelated
          # deprecation in a new Sphinx cannot block a docs publish.
          if grep -q 'dvflow.load' /tmp/sphinx.log; then
            echo "::error::sphinx-dv-flow could not load a flow package:"
            grep 'dvflow.load' /tmp/sphinx.log
            exit 1
          fi
          echo "OK: $n pages, reference and dvf indices present, every flow package loaded"

      - name: Upload docs
        # Consumed by the host-side poller:
        #   docs-fetch dv-flow/dv-flow-libhdllint main
        # Note the explicit branch -- docs-fetch defaults to `master` and every
        # repo in this org uses `main`.
        uses: forgejo/upload-artifact@v4
        with:
          name: docs-dv-flow-dv-flow-libhdllint
          path: docs/_build/html/**
          if-no-files-found: error
